[workspace]
members = [
    "crates/orbit-core",
    "crates/orbit-runtime",
    "crates/orbit-server",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Giridhari Karmakar <giridhari-code@users.noreply.github.com>"]
repository = "https://github.com/giridhari-code/orbit-engine"
description = "Memory-safe Looped Mixture-of-Experts (Looped MoE) LLM inference engine"

[workspace.dependencies]
candle-core = { version = "0.8", default-features = false }
candle-nn = { version = "0.8", default-features = false }
tokenizers = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
